[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repolens-inspector"
version = "0.1.0"
description = "Evidence-based, read-only GitHub and local repository analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "RepoLens contributors"}]
dependencies = ["httpx[socks]>=0.27,<1", "pydantic>=2.7,<3", "typer>=0.12,<1", "pathspec>=0.12,<1"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.8,<1", "build>=1,<2"]

[project.scripts]
repolens = "repolens.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["repolens"]
branch = true

[tool.coverage.report]
show_missing = true
